# Fly.io config for the PlacePal backend.
# Deploy from this directory: `fly deploy`
app = "placepal-api"
primary_region = "bom"  # Mumbai — change to your nearest region (fly platform regions)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  NODE_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # always-on: cron email sync + background jobs
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Resume PDFs are stored on disk — persist them across redeploys.
[mounts]
  source = "placepal_uploads"
  destination = "/app/uploads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
