# Render Blueprint for PlacePal.
# Dashboard -> New -> Blueprint -> connect this repo. Render reads this file and
# provisions the web service + Postgres. Fill the `sync: false` secrets afterward.
databases:
  - name: placepal-db
    plan: free              # free Postgres is deleted ~30 days after creation
    region: singapore       # closest free region to India (users are in India)
    databaseName: placepal
    user: placepal

services:
  - type: web
    name: placepal-api
    runtime: docker
    plan: free              # free web services sleep after ~15 min idle
    region: singapore       # ~60-90ms from India vs ~300ms from Oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres connection string wired automatically from the DB above
      - key: DATABASE_URL
        fromDatabase:
          name: placepal-db
          property: connectionString
      # Secure random secret generated by Render (long enough for our >=32 char check)
      - key: JWT_SECRET
        generateValue: true
      # --- Fill these in the Render dashboard after the first sync ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI       # https://placepal-api.onrender.com/api/auth/google/callback
        sync: false
      - key: FRONTEND_URL             # your deployed frontend origin (CORS + Socket.io + OAuth)
        sync: false
      - key: ALLOWED_ORIGINS          # optional: comma-separated extra origins (e.g. Vercel previews)
        sync: false
